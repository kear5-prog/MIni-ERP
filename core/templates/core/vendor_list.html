
{% extends 'core/base.html' %}
{% block title %}Vendors{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Vendors</h2>
  <a href="{% url 'vendor_create' %}" class="btn btn-primary">Add Vendor</a>
</div>

<div class="card">
  <div class="card-body">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for vendor in vendors %}
        <tr>
          <td>{{ vendor.name }}</td>
          <td>{{ vendor.phone }}</td>
          <td>{{ vendor.address }}</td>
          <td>
            <a href="{% url 'vendor_edit' vendor.pk %}" class="btn btn-sm btn-secondary">Edit</a>
          </td>
        </tr>
        {% empty %}
        <tr><td colspan="4">No vendors found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
